# Netlify deploy config — kneeabilitynarine.com
# Static build via vite-react-ssg (publish dir: dist).

[build]
  command = "npm run build"
  publish = "dist"

# Serverless functions (newsletter sign-up -> GHL)
[functions]
  directory = "netlify/functions"

# The course page has been taken down. Anyone with the old link goes to the home page.
[[redirects]]
  from = "/course"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/course/*"
  to = "/"
  status = 302
  force = true
